# What HyperFlux Next V2 knows about the receiver and the devices that pair
# with it.
#
# This is the readable catalog. Code keeps its own copies:
#   crates/hfx-proto/src/devices.rs        everything below but the sources
#   integrations/openrgb/src/device_table.hpp   devices with an [openrgb] part
#   integrations/openrazer/70-hyperflux-next-openrazer-keys.rules   key links
#   integrations/openrazer/hyperflux-next-openrazer.modules-load.conf
# tests/test_device_tables.py checks that every copy says the same thing,
# so change this file and the copies together. tests/test_upstream_tables.py
# and integrations/openrgb/tests/check-device-table.py hold the entries to
# the pinned OpenRazer and OpenRGB sources.
#
# Device fields:
#   product_id        id the device has through the receiver (its wireless id)
#   wired_product_id  id on a USB cable
#   name              OpenRazer's name for the wireless device without
#                     "(Wireless)"; OpenRGB's name when OpenRazer lacks it
#   tier              tested   used through the receiver on real hardware
#                     checked  Razer lists it for the HyperFlux V2, OpenRazer
#                              3.12.4 or OpenRGB 1.1 drives it, and the entry
#                              matches theirs; not yet tested through the
#                              receiver
#                     listed   Razer lists it, but neither release drives it
#   charge            how passive status bytes become a charging state:
#                     mouse-status or keyboard-status, both learned on
#                     hardware, or none. A tested or checked device with
#                     none is asked 07/84 whatever its commands say, and its
#                     answer read as OpenRazer reads it.
#   first_get_delay_us  how long the bridge first waits after sending a
#                     request before its first read, then learns the
#                     device's own; below 6000 only with hyperfluxctl bench
#                     results from the device itself
#   commands          "class:id:sizes" the device accepts through a route,
#                     the union of what OpenRazer 3.12.4 and OpenRGB 1.1
#                     send. The two that only OpenRGB drives also keep
#                     00:84:2, which bench sends first to every device.
#   [device.openrazer]  present when OpenRazer 3.12.4 supports the device;
#                       event_file_regex is left out when the daemon class
#                       has none; key_event_link is the suffix of the by-id
#                       link the udev rule creates for Ripple (keyboards),
#                       and key_link_overlaps the other daemon classes whose
#                       regex matches that link too
#   [device.openrgb]    present when OpenRGB 1.1 supports the device
#   [device.sources]    where the entry comes from:
#                       razer       [sources] pages that list the device
#                       openrazer   "<version> <driver> <wireless pid macro>"
#                       openrgb     "<version> <razer_device record>"
#                       public      owner data not taken through the
#                                   receiver; openrazer#N is an issue or pull
#                                   request on github.com/openrazer/openrazer
#                       reports     device reports through the receiver
#                       hardware    what has been used through the
#                                   receiver on real hardware

[receiver]
name = "Razer HyperFlux V2"
vendor_id = 0x1532
product_id = 0x00cf
pointer_lane_selector = 0x1f
keyboard_lane_selector = 0x9f

[openrazer]
modules = ["razeraccessory", "razerkbd", "razerkraken", "razermouse"]
patched_modules = ["razerkbd", "razermouse"]

# Razer's pages as they were seen, with the ids of the devices each lists.
