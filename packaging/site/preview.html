<!doctype html>
<!-- The link preview: scripts/site-images.sh renders it to preview.png at
     1280x640, the size GitHub asks for. Not published itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Martian Mono";
  src: url("fonts/martian-mono.woff2") format("woff2");
  font-weight: 400 700;
  font-stretch: 87.5% 112.5%;
}
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body {
  box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; gap: 30px;
  background: #040805; color: #e1f1de; font-family: "Martian Mono", monospace; font-stretch: 87.5%;
}
.mark { display: flex; align-items: center; gap: 22px; font-size: 30px; font-weight: 700; font-stretch: 112.5%; }
.mark img { width: 72px; height: 72px; }
h1 { margin: 0; font-size: 54px; font-weight: 500; font-stretch: 112.5%; letter-spacing: -0.02em; line-height: 1.1; }
pre {
  margin: 0; padding: 26px 32px; font: inherit; font-size: 27px; line-height: 1.6;
  background: #070d08; border: 1px solid #1a271b; color: #b9d3b4;
}
.prompt { color: #6f9a6b; }
.cmd { color: #e1f1de; }
.lead { margin: -10px 0 0; font-size: 24px; color: #8aa886; }
.url { margin-top: auto; font-size: 22px; color: #7ef473; }
</style>
</head>
<body>
<div class="mark"><img src="icon.svg" alt="">hyperflux-next-v2</div>
<h1>Razer HyperFlux V2 on Linux.</h1>
<p class="lead">OpenRazer, Polychromatic and OpenRGB control the devices paired to it.</p>
<pre><span class="prompt">~ $ </span><span class="cmd">hyperfluxctl battery</span>
Razer Basilisk V3 Pro 35K: 79% charging
Razer DeathStalker V2 Pro TKL: 95%</pre>
<div class="url">@SITE@</div>
</body>
</html>
