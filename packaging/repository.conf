# Settings of the package repository on GitHub Pages, read by
# scripts/repo-*.sh. The site address is SITE_URL in the top-level Makefile.

# Distribution releases the repository serves: APT's suite names, and the
# release numbers the site's page shows.
UBUNTU_SUITE=stonking
UBUNTU_RELEASE=26.10
DEBIAN_SUITE=forky
DEBIAN_RELEASE=14
FEDORA_RELEASE=44

# The project signing key: the full fingerprint of the subkey that signs,
# and the public key that users download (docs/maintainer/signing.md).
SIGNING_KEY=69F35BC04765FB65A86CD4C93E3C3891CB2621D9
KEY_FILE=packaging/keys/hyperflux-next-repository-key.asc

# Where repo-publish.sh pushes the gh-pages branch.
PAGES_REMOTE=https://github.com/hyperflux-next/hyperflux-next-v2.git
