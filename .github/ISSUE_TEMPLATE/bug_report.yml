name: Bug report
description: Something doesn't work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Short answers are fine. Please leave out serial numbers and full system journals;
        the privacy page says what each hyperfluxctl file holds.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices
      description: Keyboard and mouse models, and whether they were on the receiver or a cable.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: >-
        Distribution, kernel (`uname -r`) and HyperFlux Next V2 version: `pacman -Q hyperflux-next-v2-linux`,
        `dpkg-query -W hyperflux-next-v2-linux` or `rpm -q hyperflux-next-v2-linux`.
      placeholder: Arch Linux, 7.2.11-arch1-1, 1.0.2-1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of hyperfluxctl doctor
      description: Leave it empty if the command doesn't run.
      render: text
  - type: textarea
    id: bundle
    attributes:
      label: Output of hyperfluxctl support-bundle --preview
      description: It only shows what a bundle would contain. Attach the bundle itself only if the maintainer asks.
      render: text
