version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  # Cargo.toml pins exact versions on purpose; a bump arrives as one PR
  # that changes the pin and Cargo.lock together.
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      crates:
        patterns: ["*"]
  # The build images are pinned by digest in these files, all but
  # openSUSE Tumbleweed's (see its Containerfile).
  - package-ecosystem: docker
    directory: /packaging/containers
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    # fedora-44.Containerfile builds the Fedora 44 packages and has to stay
    # on 44 (likewise Ubuntu 26.10). Only their digests move, and a new
    # release gets a file of its own.
    ignore:
      - dependency-name: library/fedora
        update-types: ["version-update:semver-major"]
      - dependency-name: library/ubuntu
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
