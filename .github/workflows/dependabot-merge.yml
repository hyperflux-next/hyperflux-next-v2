name: Dependabot merge

# Dependabot's updates land on dev by themselves once every check the branch
# requires has passed. An update that changes a major version waits for a
# person, since that is where a dependency changes how it works. GitHub only
# merges on its own into a branch that requires checks, which a free plan
# offers for public repositories, so the job waits until this one is public.

on: pull_request

permissions:
  contents: read

jobs:
  merge:
    # Only Dependabot's own pushes. fetch-metadata refuses a commit a person
    # rebased or pushed, and the job would fail instead of being skipped.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: update
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once the checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          ECOSYSTEM: ${{ steps.update.outputs.package-ecosystem }}
          UPDATE: ${{ steps.update.outputs.update-type }}
        run: |
          # fetch-metadata compares a pinned image's old digest with its tag
          # name and calls every digest bump semver-major. One that keeps
          # each image and tag and only moves the digest is small.
          if [ "$ECOSYSTEM" = docker ]; then
            diff=$(gh pr diff "$PR" | grep -E '^[-+]' | grep -vE '^(---|\+\+\+) ' || true)
            other=$(printf '%s\n' "$diff" | grep -vE '^[-+]FROM ' || true)
            moved=$(printf '%s\n' "$diff" | sed -E 's/^[-+]//; s/@sha256:[0-9a-f]+//' | sort | uniq -u)
            if [ -n "$other" ] || [ -n "$moved" ]; then
              echo "Changes more than a digest; leaving it for review."
              exit 0
            fi
          elif [ "$UPDATE" = version-update:semver-major ]; then
            echo "A major update; leaving it for review."
            exit 0
          fi
          gh pr merge --auto --squash "$PR"
