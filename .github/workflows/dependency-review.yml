name: Dependency review

# Fails a pull request that brings in a dependency with a known
# vulnerability: a crate in Cargo.lock or an action in these workflows.
# Like CodeQL, it needs a public repository.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
